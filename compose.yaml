services:
  app:
    build: .
    env_file: .env
    environment:
      # Sovrascrive il valore locale del .env: dal container LM Studio è sull'host.
      LMSTUDIO_BASE_URL: http://host.docker.internal:1234/v1
    stdin_open: true
    tty: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
