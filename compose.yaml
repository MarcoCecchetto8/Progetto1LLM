# Step 9: quattro container (db, agent, backend, frontend). LM Studio resta sull'host.
# La CLI (app) parte solo con: docker compose run --rm app
services:
  db:
    image: postgres:18.6-alpine
    env_file: .env
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
  agent:
    # Nessuna porta pubblicata: lo raggiungono solo backend e app, nella rete di Compose.
    # Server MCP (stdio) e servizio delle note partono dentro il container.
    build:
      context: .
      dockerfile: agent_service/Dockerfile
    env_file: .env
    environment:
      # Sovrascrive il valore locale del .env: dal container LM Studio è sull'host.
      LMSTUDIO_BASE_URL: http://host.docker.internal:1234/v1
    volumes:
      - ./data:/app/data
      - ./config/preferenze.json:/app/config/preferenze.json:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
  backend:
    build:
      context: .
      dockerfile: backend_service/Dockerfile
    environment:
      # Composto da Compose con i POSTGRES_* del .env: il back-end non riceve il .env intero.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      BACKEND_AGENT_URL: http://agent:8001
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8002:8002"
  frontend:
    # FRONTEND_BACKEND_URL resta quella predefinita (http://127.0.0.1:8002): è l'indirizzo visto dal browser.
    build:
      context: .
      dockerfile: frontend_service/Dockerfile
    ports:
      - "127.0.0.1:8003:8003"
  app:
    build:
      context: .
      dockerfile: agent_service/Dockerfile
    command: ["python", "-m", "assistant"]
    profiles: ["cli"]
    env_file: .env
    environment:
      AGENT_SERVICE_URL: http://agent:8001
    depends_on:
      - agent
    stdin_open: true
    tty: true
volumes:
  pgdata:
